services:
  - type: web
    name: brandguard-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: 1c-2g
    numInstances: 1
    healthCheckPath: /api/health/database
    disk:
      name: brandguard-data
      mountPath: /var/data/brandguard
      sizeGB: 10
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PERSISTENT_STORAGE_ROOT
        value: /var/data/brandguard
      - key: UPLOAD_DIRECTORY
        value: /var/data/brandguard/uploads
      - key: CHROMA_PERSIST_DIRECTORY
        value: /var/data/brandguard/chroma
      - key: CLAMAV_HOST
        sync: false
      - key: CLAMAV_PORT
        sync: false
      - key: CLAMAV_TIMEOUT_SECONDS
        value: "10"
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract
      - key: EXTERNAL_SEARCH_PROVIDER
        value: disabled
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
