services:
  - type: web
    name: brandguard-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health/database
    envVars:
      - key: ENVIRONMENT
        value: demo
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: UPLOAD_DIRECTORY
        value: /tmp/brandguard-uploads
      - key: CHROMA_PERSIST_DIRECTORY
        value: /tmp/brandguard-chroma
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
